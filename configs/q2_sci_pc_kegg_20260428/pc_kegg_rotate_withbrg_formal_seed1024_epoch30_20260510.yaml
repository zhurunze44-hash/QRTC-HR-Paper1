# PC_KEGG withBRG RotatE formal train — seed 1024 — epoch 30 — 2026-05-10
# Train only (smoke_skip_valid); no checkpoint field for cold start.

output_dir: paper1_q2_sci_package_20260428/baseline_rotate_20260510/pc_kegg_withbrg_rotate_formal_seed1024_epoch30

dataset:
  class: biomedical
  path: /root/autodl-tmp/BioPathNet_fresh/data/PC_KEGG_0602
  include_factgraph: yes
  fact_as_train: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: RotatE
    embedding_dim: 128
    max_score: 6
  criterion: bce
  num_negative: 512
  strict_negative: yes
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  adversarial_temperature: 1
  sample_weight: yes

optimizer:
  class: Adam
  lr: 2.0e-4

engine:
  gpus: {{ gpus }}
  batch_size: 4096

train:
  num_epoch: 30

  smoke_skip_valid: yes
metric: mrr
