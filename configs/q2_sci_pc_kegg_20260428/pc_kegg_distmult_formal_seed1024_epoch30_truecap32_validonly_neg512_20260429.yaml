output_dir: paper1_q2_sci_package_20260428/pc_kegg_distmult_formal_seed1024_epoch30_truecap32_validonly_neg512

dataset:
  class: biomedical
  path: <REDACTED_SERVER_PATH>
  include_factgraph: yes
  fact_as_train: yes
  
task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: DistMult
    embedding_dim: 128
    l3_regularization: 2.0e-6
  criterion: bce
  num_negative: 512
  strict_negative: yes
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  adversarial_temperature: 1
  sample_weight: yes

optimizer:
  class: Adam
  lr: 1.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 4096

train:
  num_epoch: 30

  smoke_skip_valid: yes
metric: mrr

checkpoint: <REDACTED_SERVER_PATH>
