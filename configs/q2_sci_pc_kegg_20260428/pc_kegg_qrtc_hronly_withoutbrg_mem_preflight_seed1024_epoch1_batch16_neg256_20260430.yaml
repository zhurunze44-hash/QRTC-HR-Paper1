output_dir: paper1_q2_sci_package_20260428/pc_kegg_qrtc_hronly_withoutbrg_mem_preflight_seed1024_epoch1_batch16_neg256

dataset:
  class: biomedical
  path: <REDACTED_SERVER_PATH>
  include_factgraph: no
  
task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
  criterion: bce
  num_negative: 256
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no


optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 16
  

train:
  num_epoch: 1
  batch_per_epoch: 20
  smoke_skip_valid: yes
  
metric: mrr
