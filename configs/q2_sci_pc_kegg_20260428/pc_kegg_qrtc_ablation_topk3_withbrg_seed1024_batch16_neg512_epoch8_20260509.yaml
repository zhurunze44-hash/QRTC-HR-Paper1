output_dir: paper1_q2_sci_package_20260428/qrtc_ablation_20260509/pc_kegg_withbrg_qrtc_topk3_seed1024_epoch8

dataset:
  class: biomedical
  path: /root/autodl-tmp/BioPathNet_fresh/data/PC_KEGG_0602
  include_factgraph: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
  criterion: bce
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 16

train:
  smoke_skip_valid: yes
  num_epoch: 8

metric: mrr
