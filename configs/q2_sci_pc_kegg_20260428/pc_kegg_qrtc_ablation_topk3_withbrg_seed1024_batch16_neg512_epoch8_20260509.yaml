# Preview only — no train/eval executed from Stage 0 audit.
#
# Planned train env (shell):
#   QRTC_ENABLE=1
#   QRTC_USE_MEMORY=1
#   QRTC_TOPK=3
#
# Required pollution/auxiliary disables (same for all ablations in this plan):
#   FAMILY_CTX_ENABLE=0
#   FAMILY_CTX_WSA_ENABLE=0
