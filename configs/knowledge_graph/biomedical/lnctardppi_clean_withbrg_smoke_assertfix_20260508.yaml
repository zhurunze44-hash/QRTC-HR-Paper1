# One-epoch / one-batch-per-epoch smoke after symmetric fix. QRTC and extras off via env.
output_dir: paper1_q2_sci_package_20260428/lnctardppi_qrtc_hr_full_closure_20260508/clean_withbrg_smoke_assertfix_20260508

dataset:
  class: biomedical
  path: /root/autodl-tmp/BioPathNet_fresh/data/lnctardppi
  include_factgraph: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
    symmetric: no
  criterion: bce
  num_negative: 16
  strict_negative: yes
  adversarial_temperature: 0.5
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 2

train:
  num_epoch: 1
  batch_per_epoch: 1
  smoke_skip_valid: yes

metric: mrr
