# LncTarD-PPI withBRG RotatE formal train — seed 1024 — epoch 30 — 2026-05-10
# Based on lnctardppi_rotate_withbrg_smoke_seed1024_epoch1_20260510.yaml — train only; no checkpoint field (cold start).
# No full valid/test in run.py (smoke_skip_valid: yes).

output_dir: paper1_q2_sci_package_20260428/baseline_rotate_20260510/lnctardppi_withbrg_rotate_formal_seed1024_epoch30

paper_protocol:
  symmetric: no
  note: "symmetric=no matches lnctardppi_clean_withbrg_formal; RotatE has no symmetric hyperparameter."

dataset:
  class: biomedical
  path: /root/autodl-tmp/BioPathNet_fresh/data/lnctardppi
  include_factgraph: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: RotatE
    embedding_dim: 128
    max_score: 6
  criterion: bce
  num_negative: 64
  strict_negative: yes
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  adversarial_temperature: 1
  sample_weight: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 2.0e-4

engine:
  gpus: {{ gpus }}
  batch_size: 512

train:
  num_epoch: 30
  smoke_skip_valid: yes

metric: mrr
