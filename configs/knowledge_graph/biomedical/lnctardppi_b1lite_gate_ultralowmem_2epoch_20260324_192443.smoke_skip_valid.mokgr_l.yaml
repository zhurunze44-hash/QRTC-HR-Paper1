output_dir: <REDACTED_SERVER_PATH>

dataset:
  class: biomedical
  path: <REDACTED_SERVER_PATH>
  include_factgraph: yes
  
task:
  class: KnowledgeGraphCompletionBiomed
  model:
    mokgr_l_enable: yes
    mokgr_l_min_hop: 2
    mokgr_l_max_hop: 6
    mokgr_l_num_experts: 3
    mokgr_l_temperature: 1.1
    class: NBFNet
    edge_gate: yes
    gate_hidden_dim: null

    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
    symmetric: no
  criterion: bce
  num_negative: 4
  strict_negative: yes
  adversarial_temperature: 0.5
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 2

train:
  smoke_skip_valid: true
  num_epoch: 2
  batch_per_epoch: 20
  
metric: "mrr"
