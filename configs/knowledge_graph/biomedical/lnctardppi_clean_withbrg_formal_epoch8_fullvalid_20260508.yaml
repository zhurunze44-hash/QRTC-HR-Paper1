# LncTarD-PPI Clean withBRG — full valid eval only (epoch8 ckpt). No train. No caps.
# Based on lnctardppi_clean_withbrg_formal_seed1024_20260508.yaml
output_dir: paper1_q2_sci_package_20260428/lnctardppi_qrtc_hr_full_closure_20260508/clean_withbrg_formal_epoch8_fullvalid

# Absolute path: eval_valid_only.py chdirs to a fresh working_dir; relative ckpt would break.
checkpoint: /root/autodl-tmp/BioPathNet_fresh/paper1_q2_sci_package_20260428/lnctardppi_qrtc_hr_full_closure_20260508/clean_withbrg_formal_seed1024_epoch8/KnowledgeGraphCompletionBiomed/biomedical/NBFNet/2026-05-08-16-03-58-170358/model_epoch_8.pth

dataset:
  class: biomedical
  path: /root/autodl-tmp/BioPathNet_fresh/data/lnctardppi
  include_factgraph: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
    symmetric: no
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 0.5
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 32

metric: mrr
